version: "3.9"
name: rosfleet

# ベースcompose（共通サービス定義の雛形）
# 各platformの実体サービスは tools/orchestrate.py で解釈して個別に起動する想定。
x-common-env: &common_env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_LOG_DIR: /workspace/logs/${PLATFORM:-template_platform}

services:
  base:
    build:
      context: .
      dockerfile: tools/docker/Dockerfile.base
    image: rosfleet/base:latest
    container_name: rosfleet_base
    environment:
      <<: *common_env
      # CycloneDDS設定をxmlで指定（peersは環境変数で上書き可能）
      CYCLONEDDS_URI: file:///cyclonedds/cyclonedds.xml
      DISPLAY: ${DISPLAY}
    volumes:
      - ./workspace:/workspace
      - ./cyclonedds:/cyclonedds:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    command: ["bash"]

